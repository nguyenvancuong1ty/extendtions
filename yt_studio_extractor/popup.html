<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>YT Extractor</title>
    <style>
        body { width: 350px; font-family: sans-serif; padding: 10px; }
        button { padding: 8px 12px; margin-bottom: 10px; cursor: pointer; width: 100%; background: #065fd4; color: white; border: none; border-radius: 4px;}
        textarea { width: 100%; height: 300px; font-family: monospace; font-size: 11px; white-space: pre; }
    </style>
</head>
<body>
    <h3>YT Studio Extractor</h3>
    <p>1. Vào YouTube Studio -> Analytics của 1 video.<br>2. Bấm nút bên dưới để lấy data.</p>
    <button id="copyBtn">Lấy Data JSON & Copy</button>
    <button id="clearBtn" style="background: #cc0000;">Xóa Data Cũ</button>
    <textarea id="output"></textarea>
    <script src="popup.js"></script>
</body>
</html>
